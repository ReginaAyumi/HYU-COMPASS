name: Sync Upstream Main

on:
  schedule:
    - cron: "*/15 * * * *"   # cek otomatis tiap 30 menit
  workflow_dispatch:          # bisa juga dipicu manual kapan saja dari tab Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo kamu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch dan merge dari repo Jackson
        run: |
          git remote add upstream https://github.com/Jackson2706/RAG-Project-G5-HYU-E.git
          git fetch upstream main
          git checkout main
          git merge --ff-only upstream/main || git merge upstream/main --no-edit
          git push origin main
